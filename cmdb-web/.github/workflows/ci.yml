name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # 后端测试
  backend-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cmdb
          POSTGRES_PASSWORD: cmdb
          POSTGRES_DB: cmdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./cmdb-web/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ./cmdb-web/backend
        env:
          DATABASE_URL: postgresql://cmdb:cmdb@localhost:5432/cmdb_test
        run: |
          pytest --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./cmdb-web/backend/coverage.xml
          flags: backend

  # 前端测试
  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./cmdb-web/frontend
        run: npm ci

      - name: Run lint
        working-directory: ./cmdb-web/frontend
        run: npm run lint

      - name: Build
        working-directory: ./cmdb-web/frontend
        run: npm run build

      - name: Install Playwright
        working-directory: ./cmdb-web/frontend
        run: npx playwright install --with-deps

      - name: Run E2E tests
        working-directory: ./cmdb-web/frontend
        run: npx playwright test

      - name: Upload test report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: ./cmdb-web/frontend/playwright-report/

  # Docker 构建
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./cmdb-web/backend
          push: false
          tags: cmdb-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./cmdb-web/frontend
          push: false
          tags: cmdb-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 部署（仅 main 分支）
  deploy:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
