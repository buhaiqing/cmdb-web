version: "3.8"

services:
  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: cmdb-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cmdb-network

  # 后端 API 服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cmdb-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./cmdb.db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DEBUG: ${DEBUG:-false}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    networks:
      - cmdb-network

  # 前端 Web 服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cmdb-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cmdb-network

volumes:
  redis_data:

networks:
  cmdb-network:
    driver: bridge
