[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

markers =
    unit: 单元测试
    integration: 集成测试
    e2e: 端到端测试

filterwarnings =
    ignore::DeprecationWarning
