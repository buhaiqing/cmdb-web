# Alembic 配置文件

[alembic]
# 迁移脚本模板
script_location = alembic

# 数据库 URL（从环境变量读取）
sqlalchemy.url = postgresql://cmdb:cmdb@localhost:5432/cmdb

# 前置脚本
prepend_sys_path = .

# 版本路径
version_path_separator = os

# 时区
timezone = UTC

[post_write_hooks]
# 使用 black 格式化迁移脚本
# hooks = black
# black.type = console_scripts
# black.entry_point = black
# black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
